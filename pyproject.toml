[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "amaranth-sim-mcp"
version = "0.1.0"
description = "Minimal MCP server for running Amaranth HDL simulations."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Nejc Drobnic", email = "nejc@nejc.dev" },
]
requires-python = ">=3.11"
dependencies = [
  "amaranth>=0.5",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/quantumly/amaranth-sim-mcp"
Repository = "https://github.com/quantumly/amaranth-sim-mcp"

[project.scripts]
amaranth-sim-mcp = "amaranth_sim_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest",
]
