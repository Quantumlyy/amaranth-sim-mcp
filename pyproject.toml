[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amaranth-sim-mcp"
version = "0.1.0"
description = "Minimal MCP server for running Amaranth HDL simulations."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Nejc Drobnic", email = "nejc@nejc.dev" },
]
requires-python = ">=3.11"
dependencies = [
  "amaranth>=0.5",
  "mcp>=1.27,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/quantumly/amaranth-sim-mcp"
Repository = "https://github.com/quantumly/amaranth-sim-mcp"

[project.scripts]
amaranth-sim-mcp = "amaranth_sim_mcp.__main__:main"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-timeout",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "amaranth.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
timeout = 60
